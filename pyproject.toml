[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isc-dhcp-migrator"
version = "0.1.0"
description = "Migrate ISC DHCP configuration (dhcpd.conf) to Jagornet DHCP server configuration (YAML)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MPL-2.0" }
authors = [
    { name = "Jagornet Technologies, LLC", email = "info@jagornet.com" }
]
dependencies = [
    "netaddr>=0.8.0",
    "jinja2>=3.0.0",
    "pyyaml>=6.0"
]

[project.scripts]
isc-dhcp-migrator = "isc_dhcp_migrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["isc_dhcp_migrator*"]

[tool.setuptools.package-data]
isc_dhcp_migrator = [
    "maps/*.yml",
    "templates/*.j2"
]
